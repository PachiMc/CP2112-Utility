name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'          # triggers on tags like v1.0.0, v1.2.3
  workflow_dispatch:      # manual trigger from GitHub UI

permissions:
  contents: write         # needed to create GitHub Releases

# ─────────────────────────────────────────────────────────────────────────────
#  Build matrix: one job per OS
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: CP2112-Battery-Analyzer.exe
            asset_name:    CP2112-Battery-Analyzer-Windows.exe
            extra_deps:    ""

          - os: ubuntu-latest
            artifact_name: CP2112-Battery-Analyzer
            asset_name:    CP2112-Battery-Analyzer-Linux
            extra_deps:    |
              sudo apt-get update -y
              sudo apt-get install -y libhidapi-dev libudev-dev

          - os: macos-latest
            artifact_name: CP2112-Battery-Analyzer.app
            asset_name:    CP2112-Battery-Analyzer-macOS.zip
            extra_deps:    ""

    runs-on: ${{ matrix.os }}

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Platform-level dependencies ─────────────────────────
      - name: Install system dependencies (Linux only)
        if: runner.os == 'Linux'
        run: ${{ matrix.extra_deps }}

      # ── 3. Set up Python ─────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 4. Install Python dependencies ───────────────────────────
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 5. Build with PyInstaller ────────────────────────────────
      - name: Build executable (Windows / Linux)
        if: runner.os != 'macOS'
        working-directory: python
        run: pyinstaller cp2112_analyzer.spec --distpath dist --workpath build --noconfirm

      - name: Build .app bundle (macOS)
        if: runner.os == 'macOS'
        working-directory: python
        run: pyinstaller cp2112_analyzer.spec --distpath dist --workpath build --noconfirm

      # ── 6. Zip macOS .app bundle ─────────────────────────────────
      - name: Zip macOS .app
        if: runner.os == 'macOS'
        working-directory: python/dist
        run: zip -r CP2112-Battery-Analyzer-macOS.zip CP2112-Battery-Analyzer.app

      # ── 7. Determine the asset path ───────────────────────────────
      - name: Resolve asset path (Windows / Linux)
        if: runner.os != 'macOS'
        id: asset_path
        shell: bash
        run: echo "path=python/dist/${{ matrix.artifact_name }}" >> $GITHUB_OUTPUT

      - name: Resolve asset path (macOS)
        if: runner.os == 'macOS'
        id: asset_path_mac
        shell: bash
        run: echo "path=python/dist/CP2112-Battery-Analyzer-macOS.zip" >> $GITHUB_OUTPUT

      # ── 8. Upload to GitHub Release ───────────────────────────────
      - name: Upload release asset (Windows / Linux)
        if: runner.os != 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset_path.outputs.path }}
          name: "CP2112 Battery Analyzer ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## CP2112 Battery Analyzer ${{ github.ref_name }}

            Standalone desktop application for diagnosing and repairing laptop batteries
            via the CP2112 HID-to-SMBus USB adapter.

            ### Downloads
            | Platform | File |
            |----------|------|
            | Windows 10/11 (64-bit) | `CP2112-Battery-Analyzer-Windows.exe` |
            | Linux x86_64           | `CP2112-Battery-Analyzer-Linux` |
            | macOS 12+ (Intel/ARM)  | `CP2112-Battery-Analyzer-macOS.zip` |

            ### Quick Start
            - **Windows**: Double-click the `.exe` — no installation required.
            - **Linux**: `chmod +x CP2112-Battery-Analyzer-Linux && ./CP2112-Battery-Analyzer-Linux`
            - **macOS**: Unzip, right-click `.app` → Open (first launch requires approving unsigned app).

            > The CP2112 Silicon Labs USB driver must be installed separately on Windows.
            > Download from: https://www.silabs.com/developers/usb-to-i2c-bridge?tab=downloads

      - name: Upload release asset (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.asset_path_mac.outputs.path }}
