```yaml
name: Release Builds

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ═══════════════════════════════════════════════════════════════
  # Build for each platform
  # ═══════════════════════════════════════════════════════════════

  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: CP2112-Battery-Analyzer.exe
            asset_name: CP2112-Battery-Analyzer-Windows.exe

          - os: ubuntu-latest
            artifact_name: CP2112-Battery-Analyzer
            asset_name: CP2112-Battery-Analyzer-Linux

          - os: macos-latest
            artifact_name: CP2112-Battery-Analyzer.app
            asset_name: CP2112-Battery-Analyzer-macOS.zip

    runs-on: ${{ matrix.os }}

    steps:

      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5

      # ── 2. Linux dependencies ────────────────────────────────
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libhidapi-dev libudev-dev

      # ── 3. Python ─────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 4. Python dependencies ───────────────────────────────
      - name: Install Python dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── 5. Build ──────────────────────────────────────────────
      - name: Build with PyInstaller
        working-directory: python
        run: |
          pyinstaller cp2112_analyzer.spec \
            --distpath dist \
            --workpath build \
            --noconfirm

      # ── 6. Zip macOS app ──────────────────────────────────────
      - name: Zip macOS application
        if: runner.os == 'macOS'
        working-directory: python/dist
        run: |
          zip -r CP2112-Battery-Analyzer-macOS.zip CP2112-Battery-Analyzer.app

      # ── 7. Prepare release asset ──────────────────────────────
      - name: Prepare Windows asset
        if: runner.os == 'Windows'
        working-directory: python/dist
        shell: pwsh
        run: |
          Copy-Item `
            CP2112-Battery-Analyzer.exe `
            CP2112-Battery-Analyzer-Windows.exe

      - name: Prepare Linux asset
        if: runner.os == 'Linux'
        working-directory: python/dist
        run: |
          cp CP2112-Battery-Analyzer CP2112-Battery-Analyzer-Linux
          chmod +x CP2112-Battery-Analyzer-Linux

      # ── 8. Upload build artifact ──────────────────────────────
      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: CP2112-Battery-Analyzer-Windows
          path: python/dist/CP2112-Battery-Analyzer-Windows.exe

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: CP2112-Battery-Analyzer-Linux
          path: python/dist/CP2112-Battery-Analyzer-Linux

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: CP2112-Battery-Analyzer-macOS
          path: python/dist/CP2112-Battery-Analyzer-macOS.zip


  # ═══════════════════════════════════════════════════════════════
  # Create GitHub Release
  # ═══════════════════════════════════════════════════════════════

  release:
    needs: build

    # A Release can only be created when running from a tag.
    if: startsWith(github.ref, 'refs/tags/')

    runs-on: ubuntu-latest

    steps:

      # ── 1. Download all build artifacts ───────────────────────
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: CP2112-Battery-Analyzer-Windows
          path: release

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: CP2112-Battery-Analyzer-Linux
          path: release

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: CP2112-Battery-Analyzer-macOS
          path: release

      # ── 2. Create GitHub Release ──────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/CP2112-Battery-Analyzer-Windows.exe
            release/CP2112-Battery-Analyzer-Linux
            release/CP2112-Battery-Analyzer-macOS.zip

          name: "CP2112 Battery Analyzer ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true

          body: |
            ## CP2112 Battery Analyzer ${{ github.ref_name }}

            Standalone desktop application for diagnosing and repairing laptop batteries
            via the CP2112 HID-to-SMBus USB adapter.

            ### Downloads

            | Platform | File |
            |----------|------|
            | Windows 10/11 (64-bit) | `CP2112-Battery-Analyzer-Windows.exe` |
            | Linux x86_64 | `CP2112-Battery-Analyzer-Linux` |
            | macOS 12+ (Intel/ARM) | `CP2112-Battery-Analyzer-macOS.zip` |

            ### Quick Start

            - **Windows:** Double-click the `.exe` — no installation required.
            - **Linux:** `chmod +x CP2112-Battery-Analyzer-Linux && ./CP2112-Battery-Analyzer-Linux`
            - **macOS:** Unzip, right-click `.app` → Open. First launch may require approving the unsigned application.

            > The CP2112 Silicon Labs USB driver must be installed separately on Windows.
            > Download it from the Silicon Labs website.
```
